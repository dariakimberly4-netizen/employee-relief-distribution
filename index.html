<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Relief Distribution</title>
<style>
:root{--navy:#10233f;--blue:#1769aa;--sky:#eaf5ff;--gold:#d6a84b;--ink:#152033;--muted:#68778c;--white:#fff;--green:#16805b;--red:#b83b42}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#f7fbff,#e9f3fb);color:var(--ink);min-height:100vh}button,input,select{font:inherit}
.top{height:70px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;box-shadow:0 2px 16px #10233f12;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:#fff;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.user{display:flex;gap:10px;align-items:center}.pill{border:1px solid #dbe7f1;background:#fff;border-radius:999px;padding:8px 12px}
main{max-width:1180px;margin:auto;padding:24px 20px;min-height:calc(100vh - 70px);display:grid;place-items:center}.hero{text-align:center}.hero h1{font-size:clamp(26px,4vw,42px);margin:8px}.hero p{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px auto 28px;max-width:820px}.stat{background:#fff;border:1px solid #e2edf5;border-radius:16px;padding:13px;box-shadow:0 7px 25px #17395c0a}.stat b{font-size:21px;display:block}.stat span{font-size:12px;color:var(--muted)}
.orbit{width:min(720px,92vw);height:min(720px,92vw);min-height:540px;margin:0 auto;position:relative;border:1px dashed #a9c9df;border-radius:50%;background:radial-gradient(circle,#fff 0 29%,transparent 30%),radial-gradient(circle,#dceefa44 0 58%,transparent 59%)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:235px;height:235px;border-radius:50%;background:linear-gradient(145deg,var(--navy),#1b4b74);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;box-shadow:0 18px 50px #10233f40;z-index:3}.center h2{font-size:19px;margin:6px}.center small{opacity:.78}.center button{margin-top:12px;border:0;border-radius:999px;padding:10px 18px;background:#fff;color:var(--navy);font-weight:800;cursor:pointer}
.node{position:absolute;width:128px;height:128px;border-radius:50%;border:2px solid #d5e7f2;background:#fff;box-shadow:0 9px 28px #123c5f1c;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;cursor:pointer;transition:.2s;transform:translate(-50%,-50%);font-weight:750}.node:hover{transform:translate(-50%,-50%) scale(1.06);border-color:var(--blue)}.node .ico{font-size:25px;margin-bottom:5px}.node small{font-size:10px;color:var(--muted);font-weight:600}.new{animation:glow 1.4s infinite;position:absolute;right:3px;top:3px;background:#f4c451;color:#5b4200;border-radius:999px;padding:3px 6px;font-size:9px}@keyframes glow{50%{box-shadow:0 0 0 8px #f4c45133}}
.n1{left:50%;top:8%}.n2{left:80%;top:20%}.n3{left:92%;top:50%}.n4{left:80%;top:80%}.n5{left:50%;top:92%}.n6{left:20%;top:80%}.n7{left:8%;top:50%}.n8{left:20%;top:20%}
.panel{display:none;position:fixed;inset:0;background:#f5f9fc;z-index:50;overflow:auto}.panel.active{display:block}.panel-head{background:#fff;padding:16px 5vw;display:flex;align-items:center;gap:16px;box-shadow:0 2px 15px #10233f10;position:sticky;top:0}.back{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.panel-body{max-width:1050px;margin:auto;padding:30px 20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #dfebf3;border-radius:18px;padding:18px;box-shadow:0 8px 24px #17395c0b}.card h3{margin-top:0}.tag{display:inline-block;border-radius:999px;padding:5px 9px;background:#e8f7f1;color:var(--green);font-size:12px;font-weight:800}.action{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse;background:#fff;border-radius:15px;overflow:hidden}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #edf2f6;font-size:14px}.table th{background:#eef6fb}.login{position:fixed;inset:0;background:linear-gradient(145deg,#0d223c,#1769aa);z-index:100;display:grid;place-items:center;padding:20px}.login.hidden{display:none}.loginbox{background:#fff;border-radius:24px;padding:30px;width:min(430px,100%);box-shadow:0 30px 80px #0004}.loginbox h1{margin-bottom:5px}.rolegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{padding:16px;border:1px solid #dce8f1;border-radius:14px;background:#f8fbfd;cursor:pointer;font-weight:800}.role:hover{border-color:var(--blue)}.notice{margin-top:16px;padding:12px;border-radius:12px;background:#fff7dd;color:#6a5100;font-size:13px}
.feature-new{position:relative;box-shadow:0 0 0 3px #f4c45188,0 0 22px #f4c45155!important}.feature-new:after{content:"NEW";position:absolute;right:-7px;top:-10px;background:#f4c451;color:#5b4200;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:900}
@media(max-width:700px){
main{padding:14px 10px;min-height:calc(100vh - 58px);overflow:hidden}
.orbit{width:min(94vw,560px);height:auto;aspect-ratio:1/1;min-height:0;max-width:none;margin:auto;border-radius:50%}
.node{width:19%;height:auto;aspect-ratio:1/1;font-size:clamp(9px,2.55vw,11px);line-height:1.06;padding:5px}
.node .ico{font-size:clamp(17px,5vw,23px);margin-bottom:3px}.node small{font-size:clamp(8px,2.25vw,10px);line-height:1.08;margin-top:3px}
.center{width:31.5%;height:auto;aspect-ratio:1/1;padding:10px}.center h2{font-size:clamp(13px,3.6vw,17px);margin:3px}.center span,.center small{font-size:clamp(8px,2.15vw,10px)}.center button{padding:7px 11px;margin-top:6px;font-size:clamp(10px,2.7vw,13px)}
.n1{left:50%;top:9.5%}.n2{left:79%;top:21%}.n3{left:90.5%;top:50%}.n4{left:79%;top:79%}.n5{left:50%;top:90.5%}.n6{left:21%;top:79%}.n7{left:9.5%;top:50%}.n8{left:21%;top:21%}
.cards{grid-template-columns:1fr}.top{height:58px;padding:0 10px}.brand{gap:8px}.brand small{display:none}.brand b{font-size:13px;line-height:1.12;max-width:170px}.mark{width:34px;height:34px;font-size:13px}.pill{padding:6px 9px;font-size:12px}.user{gap:6px}
.new{right:0;top:0;font-size:8px;padding:3px 5px}
}
</style></head><body>
<div class="login" id="login"><div class="loginbox"><div class="mark">ER</div><h1>Employee Relief Distribution</h1><p style="color:var(--muted)">Choose a demo portal. One tap login.</p><div class="rolegrid"><button class="role" onclick="login('Staff / Encoder')">👤 Staff / Encoder</button><button class="role" onclick="login('Administrator')">🛡️ Administrator</button></div><div class="notice">Demo mode • Data is stored only in this browser.</div></div></div>
<header class="top"><div class="brand"><div class="mark">ER</div><div><b>Employee Relief Distribution</b><small>Distribution Command Center</small></div></div><div class="user"><span class="pill" id="role">Demo</span><button class="pill" onclick="logout()">Log out</button></div></header>
<main><section class="orbit">
<button class="node n1" onclick="openPanel('verify',this)"><span class="ico">✓</span>Employee Verification<small>Masterlist & eligibility</small></button>
<button class="node n2" onclick="openPanel('allocation',this)"><span class="ico">📦</span>Relief Allocation<small>Assign packages</small></button>
<button class="node n3" onclick="openPanel('queue',this)"><span class="ico">🎟️</span>Digital Queue<small>Live serving</small></button>
<button class="node n4" onclick="openPanel('schedule',this)"><span class="ico">📅</span>Scheduling<small>One-time slot</small></button>
<button class="node n5" onclick="openPanel('claim',this)"><span class="new">NEW</span><span class="ico">📲</span>Claim & Release<small>QR / ID check</small></button>
<button class="node n6" onclick="openPanel('inventory',this)"><span class="ico">📊</span>Inventory Live<small>Stock reconciliation</small></button>
<button class="node n7" onclick="openPanel('sites',this)"><span class="new">NEW</span><span class="ico">📍</span>Distribution Sites<small>Site status</small></button>
<button class="node n8" onclick="openPanel('reports',this)"><span class="ico">🧾</span>Reports & Audit<small>Trace every release</small></button>
<div class="center"><small>EMPLOYEE RELIEF HUB</small><h2>Distribution Orbit</h2><span><b id="served">327</b> served • <b id="packs">159</b> packs left</span><small style="margin-top:6px">Queue # A-024 • VERIFIED</small><button id="here" onclick="imHere()">I'M HERE</button></div>
</section></main>
<div class="panel" id="panel"><div class="panel-head"><button class="back" onclick="closePanel()">← Back to Orbit</button><h2 id="ptitle">Module</h2></div><div class="panel-body" id="pbody"></div></div>
<script>
const data={
verify:['Employee Verification',`<div class="cards"><div class="card feature-new" data-feature="masterlist" onclick="seenFeature(this,'masterlist')"><h3>Employee Masterlist</h3><p>Search, add or verify employees. Import is ready for employee records.</p><div class="row"><input class="pill" id="empsearch" value="EMP-2026-024"><button class="action" onclick="event.stopPropagation();verifyEmployee()">Verify</button></div><br><button class="action" onclick="event.stopPropagation();importDemo()">Import Excel Demo</button></div><div class="card"><h3>Employee Record</h3><b>Maria Santos</b><p>City Accounting Office<br>Regular Employee</p><span class="tag">ELIGIBLE</span></div><div class="card"><h3>Duplicate Protection</h3><p>One employee, one valid claim per distribution cycle.</p><span class="tag">NO PRIOR CLAIM</span></div></div>`],
allocation:['Relief Allocation',`<div class="cards"><div class="card"><h3>Standard Relief Pack</h3><p>Rice • canned goods • noodles • hygiene kit</p><button class="action" onclick="allocatePack()">Allocate Pack</button></div><div class="card feature-new" data-feature="cycle" onclick="seenFeature(this,'cycle')"><h3>Distribution Cycle Setup</h3><p><b>Typhoon Relief 2026</b><br>Main Hall • Active</p><button class="action" onclick="event.stopPropagation();setupCycle()">Manage Cycle</button></div><div class="card"><h3>Department Allocation</h3><b>Accounting</b><p>42 eligible • 31 allocated</p></div></div>`],
queue:['Digital Queue',`<div class="cards"><div class="card"><h3>NOW SERVING</h3><h1 id="nowServing">A-021</h1><div class="row"><button class="action" onclick="callNext()">Call Next</button><button class="action" onclick="skipQueue()">Skip</button><button class="action" onclick="recallQueue()">Recall</button></div></div><div class="card"><h3>Waiting</h3><h1 id="waitingCount">24</h1><p>Average wait: 8 min</p></div><div class="card feature-new" data-feature="queuecontrols" onclick="seenFeature(this,'queuecontrols')"><h3>Queue Controls</h3><p>Call, skip, recall and mark no-show with an audit record.</p><button class="action" onclick="event.stopPropagation();noShow()">Mark No Show</button></div></div>`],
schedule:['Distribution Scheduling',`<div class="cards"><div class="card feature-new" data-feature="scheduleflow" onclick="seenFeature(this,'scheduleflow')"><h3>One-Time Schedule</h3><p>Maria Santos • Main Hall</p><select class="pill" id="slot"><option>2:30 PM</option><option>2:45 PM</option><option>3:00 PM</option></select><br><br><button class="action" onclick="event.stopPropagation();confirmSchedule()">Confirm Schedule</button></div><div class="card"><h3>Schedule Rule</h3><p>Only one active schedule per employee for each distribution cycle.</p><span class="tag">DUPLICATE PROTECTED</span></div><div class="card"><h3>No-show / Reschedule</h3><p>Authorized staff can move an unclaimed schedule and retain its audit history.</p><button class="action" onclick="toast('Reschedule mode opened')">Reschedule</button></div></div>`],
claim:['Claim & Release',`<div class="cards"><div class="card feature-new" data-feature="digitalpass" onclick="seenFeature(this,'digitalpass')"><h3>Digital Relief Pass</h3><p id="passStatus">Generate only after verification and allocation.</p><button class="action" onclick="event.stopPropagation();generatePass()">Generate Pass</button><div id="passBox"></div></div><div class="card feature-new" data-feature="releaseflow" onclick="seenFeature(this,'releaseflow')"><h3>Scan → Verify → Release</h3><p>Maria Santos • Accounting</p><span class="tag">VERIFIED</span><br><br><button class="action" onclick="event.stopPropagation();scanPass()">Scan Pass</button> <button class="action" onclick="event.stopPropagation();releasePack()">Release Pack</button></div><div class="card feature-new" data-feature="receipt" onclick="seenFeature(this,'receipt')"><h3>Claim Receipt</h3><p id="receiptText">Receipt becomes available after successful release.</p><button class="action" onclick="event.stopPropagation();showReceipt()">View Receipt</button></div><div class="card feature-new" data-feature="proxy" onclick="seenFeature(this,'proxy')"><h3>Proxy Claiming</h3><p>Record representative, relationship, ID and authorization reason.</p><button class="action" onclick="event.stopPropagation();proxyClaim()">Add Proxy</button></div></div>`],
inventory:['Inventory Live',`<div class="cards"><div class="card"><h3>Relief Packs</h3><h1 id="invpacks">159</h1><p>Available now</p></div><div class="card"><h3>Reserved</h3><h1>72</h1><p>For scheduled employees</p></div><div class="card feature-new" data-feature="inventorytx" onclick="seenFeature(this,'inventorytx')"><h3>Inventory Transactions</h3><p>Receive, transfer, damaged, return and adjustment records.</p><div class="row"><button class="action" onclick="event.stopPropagation();inventoryTx('Received +25')">Receive</button><button class="action" onclick="event.stopPropagation();inventoryTx('Transferred 10')">Transfer</button><button class="action" onclick="event.stopPropagation();inventoryTx('Damaged -1')">Damaged</button></div></div></div>`],
sites:['Distribution Sites',`<div class="cards"><div class="card"><h3>Main Hall</h3><span class="tag">OPEN</span><p>3 release stations • Queue 18</p></div><div class="card"><h3>Annex Lobby</h3><span class="tag">OPEN</span><p>2 release stations • Queue 6</p></div><div class="card feature-new" data-feature="notifications" onclick="seenFeature(this,'notifications')"><h3>Employee Notifications</h3><p>Schedule, queue, reschedule and successful claim notices.</p><button class="action" onclick="event.stopPropagation();sendNotice()">Send Demo Notice</button></div></div>`],
reports:['Reports & Audit',`<div class="cards"><div class="card feature-new" data-feature="reportdash" onclick="seenFeature(this,'reportdash')"><h3>Distribution Dashboard</h3><p><b>486</b> eligible • <b>327</b> claimed • <b>24</b> waiting • <b>159</b> remaining</p><button class="action" onclick="event.stopPropagation();toast('Report export prepared')">Export Report</button></div><div class="card feature-new" data-feature="users" onclick="seenFeature(this,'users')"><h3>Users & Permissions</h3><p>Admin • Encoder • Queue Staff • Releasing Staff</p><button class="action" onclick="event.stopPropagation();toast('Role permissions opened')">Manage Roles</button></div></div><br><table class="table"><tr><th>Time</th><th>Employee</th><th>Action</th><th>Staff</th></tr><tbody id="auditBody"><tr><td>12:41</td><td>EMP-0182</td><td>Pack released</td><td>Donna</td></tr><tr><td>12:38</td><td>EMP-0179</td><td>Verified</td><td>Encoder 02</td></tr></tbody></table>`]
};
let released=localStorage.getItem('erd-released')==='1';let qnum=21;
function audit(action){let a=JSON.parse(localStorage.getItem('erd-audit')||'[]');a.unshift({time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),emp:'EMP-2026-024',action,staff:localStorage.getItem('erd-role')||'Staff'});localStorage.setItem('erd-audit',JSON.stringify(a));}
function seenFeature(el,key){localStorage.setItem('feature-seen-'+key,'1');el.classList.remove('feature-new')}
function restoreFeatureState(){document.querySelectorAll('[data-feature]').forEach(el=>{if(localStorage.getItem('feature-seen-'+el.dataset.feature))el.classList.remove('feature-new')})}
function verifyEmployee(){audit('Employee verified');toast('Employee verified and eligibility confirmed')}
function importDemo(){audit('Masterlist import tested');toast('Excel masterlist import ready')}
function allocatePack(){localStorage.setItem('erd-allocated','1');audit('Relief pack allocated');toast('Relief pack allocated')}
function setupCycle(){audit('Distribution cycle updated');toast('Typhoon Relief 2026 cycle saved')}
function confirmSchedule(){localStorage.setItem('erd-scheduled','1');audit('Schedule confirmed');toast('One-time schedule confirmed')}
function callNext(){qnum++;let n=document.getElementById('nowServing');if(n)n.textContent='A-'+String(qnum).padStart(3,'0');audit('Called next queue');toast('Next employee called')}
function skipQueue(){audit('Queue skipped');toast('Employee skipped — retained in queue')}
function recallQueue(){audit('Queue recalled');toast('Current queue number recalled')}
function noShow(){audit('Marked no-show');toast('No-show recorded')}
function generatePass(){if(!localStorage.getItem('erd-allocated'))return toast('Allocate a relief pack first');localStorage.setItem('erd-pass','ER-2026-0024');let b=document.getElementById('passBox');if(b)b.innerHTML='<div class="notice"><b>ER-2026-0024</b><br>|||| ||| || |||||<br><small>Barcode-only print pass</small></div>';audit('Digital relief pass generated');toast('Digital relief pass generated')}
function scanPass(){if(!localStorage.getItem('erd-pass'))return toast('Generate the digital pass first');audit('Relief pass scanned');toast('Pass valid • employee verified')}
function showReceipt(){if(!released)return toast('Complete release first');toast('Receipt: CLAIMED • EMP-2026-024 • '+new Date().toLocaleString())}
function proxyClaim(){audit('Proxy claim details opened');toast('Proxy authorization form opened')}
function inventoryTx(x){audit('Inventory: '+x);toast(x+' recorded')}
function sendNotice(){audit('Employee notification sent');toast('Schedule/queue notification sent')}

function login(role){localStorage.setItem('erd-role',role);document.getElementById('role').textContent=role;document.getElementById('login').classList.add('hidden')}
function logout(){localStorage.removeItem('erd-role');document.getElementById('login').classList.remove('hidden')}
function openPanel(key,btn){const n=btn.querySelector('.new');if(n){n.remove();localStorage.setItem('seen-'+key,'1')}ptitle.textContent=data[key][0];pbody.innerHTML=data[key][1];panel.classList.add('active');restoreFeatureState();if(key==='reports'){let a=JSON.parse(localStorage.getItem('erd-audit')||'[]'),tb=document.getElementById('auditBody');if(tb&&a.length)tb.innerHTML=a.slice(0,8).map(x=>'<tr><td>'+x.time+'</td><td>'+x.emp+'</td><td>'+x.action+'</td><td>'+x.staff+'</td></tr>').join('')}}
function closePanel(){panel.classList.remove('active')}
function imHere(){here.textContent='CHECKED IN ✓';here.style.background='#dff5ea';here.style.color='#126b4d';toast('Added to live queue')}
function releasePack(){if(released)return toast('Duplicate blocked — already claimed');if(!localStorage.getItem('erd-pass'))return toast('Scan/generate the relief pass first');released=true;localStorage.setItem('erd-released','1');audit('Pack released • claim completed');let s=document.getElementById('served'),p=document.getElementById('packs');s.textContent=+s.textContent+1;p.textContent=+p.textContent-1;let ip=document.getElementById('invpacks');if(ip)ip.textContent=p.textContent;toast('Relief pack released and audit trail saved')}
function toast(msg){let x=document.createElement('div');x.textContent=msg;x.style='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10233f;color:white;padding:12px 18px;border-radius:12px;z-index:200;box-shadow:0 8px 30px #0003';document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
const role=localStorage.getItem('erd-role');if(role){document.getElementById('role').textContent=role;document.getElementById('login').classList.add('hidden')}
['claim','sites'].forEach(k=>{if(localStorage.getItem('seen-'+k)){let b=document.querySelector('.n'+(k==='claim'?5:7)+' .new');if(b)b.remove()}})
</script></body></html>
